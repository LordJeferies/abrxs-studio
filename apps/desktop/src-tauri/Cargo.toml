[package]
name = "abrxs-studio"
version = "0.1.0"
description = "Abrxs Studio desktop runtime"
authors = ["LordJeferies"]
edition = "2021"

[lib]
name = "abrxs_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
