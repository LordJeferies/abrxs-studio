name: Vision Lite CI

on:
  pull_request:
    paths:
      - 'apps/vision-lite/**'
      - 'package.json'
      - '.github/workflows/vision-lite-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run vision-lite:typecheck
      - run: npm run vision-lite:build
