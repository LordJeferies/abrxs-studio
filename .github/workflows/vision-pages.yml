name: Vision Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/vision/**'
      - 'apps/vision-v3/**'
      - 'apps/vision-lite/**'
      - 'packages/design-system/**'
      - 'package.json'
      - '.github/workflows/vision-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vision-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run vision:typecheck
      - run: npm run vision:smoke
      - run: npm run vision:v2:smoke
      - run: npm run vision:v25:smoke
      - run: npm run vision:v26:smoke
      - run: npm run vision:assistant:smoke
      - run: npm run vision:mcp:smoke
      - run: npm run vision:director:mcp:smoke
      - run: npm run vision:pro:mcp:smoke
      - run: npm run vision:build:pages
      - name: Validate Vision V3
        run: |
          npm run typecheck -w @abrxs/vision-v3
          npm run build -w @abrxs/vision-v3
      - name: Validate Vision Lite
        run: |
          npm run vision-lite:typecheck
          npm run vision-lite:build
      - name: Prepare Pages artifact
        run: |
          mkdir -p site/vision site/vision-v3 site/vision-lite
          cp -R apps/vision/dist/. site/vision/
          cp -R apps/vision-v3/dist/. site/vision-v3/
          cp -R apps/vision-lite/dist/. site/vision-lite/
          cat > site/index.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./vision-v3/"><title>Abrxs Studio</title></head><body><a href="./vision-v3/">Open Abrxs Vision V3</a></body></html>
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
