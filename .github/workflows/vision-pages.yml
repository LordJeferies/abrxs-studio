name: Vision Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/vision/**'
      - 'packages/design-system/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/vision-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vision-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run vision:typecheck
      - run: npm run vision:smoke
      - run: npm run vision:build:pages
      - name: Prepare Pages artifact
        run: |
          mkdir -p site/vision
          cp -R apps/vision/dist/. site/vision/
          cat > site/index.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./vision/"><title>Abrxs Studio</title></head><body><a href="./vision/">Open Abrxs Vision Art Creator</a></body></html>
          EOF
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
